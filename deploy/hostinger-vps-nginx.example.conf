# Hostinger VPS — Nginx snippet for Vite/React SPA (MB Prime)
# Copy into your site config under /etc/nginx/sites-available/ and adjust:
#   root → path to your deployed `dist` folder (after `npm run build`)
#   server_name → mbprimeprojects.com
#
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name mbprimeprojects.com www.mbprimeprojects.com;

    # After SSL: use listen 443 ssl; + ssl_certificate paths (Certbot usually adds this)

    root /var/www/mbprime/dist;
    index index.html;

    # Let Google (and browsers) fetch real files — do NOT send these to index.html
    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /llms-full.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    # Hashed JS/CSS from Vite
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: all other routes → index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
